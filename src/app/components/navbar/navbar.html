<section class="flex w-full">
  <div class="w-full max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between p-4 gap-y-4 sm:gap-y-0">
    <a routerLink="/home" class="text-2xl font-bold text-gray-800">DocFind</a>
    @if (authService.isAuthenticated()){
      <nav class="flex">
        <ul class="flex items-center flex-wrap justify-center gap-y-2 sm:gap-y-0">
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a routerLink="/bookings" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition">My Appointments</a>
          </li>
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a routerLink="/search" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Search</a>
          </li>
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <button (click)="onSubmit()" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Logout</button>
          </li>
        </ul>
      </nav>

    } @else if (!isLoginPage){
      <nav class="flex">
        <ul class="flex items-center flex-wrap justify-center gap-y-2 sm:gap-y-0">
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a [href]='practicePortalUrl' class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Are you a doctor?</a>
          </li>
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a routerLink="/search" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Search</a>
          </li>
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a routerLink="/login" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Log in / Sign up</a>
          </li>
        </ul>
      </nav>
    }
  </div>
</section>
