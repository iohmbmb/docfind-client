<div class="flex max-w-4xl mx-auto">
  <div class="p-8 flex flex-col gap-4 text-center">
    <h1 class="font-bold text-2xl text-slate-700">What type of consultation do you need?</h1>
    @if(isNew){
      @for (consultation of newConsultations(); track consultation) {
        <div class="text-center">
          <button
            type="submit"
            (click)="onSubmit(consultation)"
            class="w-sm bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-slate-500 hover:text-slate-900 hover:bg-emerald-50/10 transition shadow-sm cursor-pointer"
          >{{consultation}}</button>
        </div>
      }
    }
    @else{
      @for (consultation of existingConsultations(); track consultation) {
        <div class="text-center">
          <button
            type="submit"
            (click)="onSubmit(consultation)"
            class="w-sm bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-slate-500 hover:text-slate-900 hover:bg-emerald-50/10 transition shadow-sm cursor-pointer"
          >{{consultation}}</button>
        </div>
      }
    }
  </div>
</div>
