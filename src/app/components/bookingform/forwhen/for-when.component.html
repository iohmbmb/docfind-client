<div class="flex max-w-4xl mx-auto">
  <div class="p-8 flex flex-col gap-4 text-center">
    <h1 class="font-bold text-2xl text-slate-700">Choose a time.</h1>
    @for(day of days(); track day){
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>{{day | date:'EEEE, d, MMMM' }}</mat-panel-title>
        </mat-expansion-panel-header>
        <div class="text-center">
          <button
            type="submit"
            class="w-sm bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-slate-500 hover:text-slate-900 hover:bg-emerald-50/10 transition shadow-sm cursor-pointer"
          >Grid of time and dates</button>
        </div>
      </mat-expansion-panel>
    }
  </div>
</div>
