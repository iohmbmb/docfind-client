<div class="flex flex-col justify-center items-center w-full min-h-[calc(100vh-128px)] px-6 pt-16 pb-12">
  <div class="bg-amber-50 rounded-xl p-8 md:p-10 w-full max-w-md max-h-fit space-y-6">
    <div class="space-y-2">
      <h1 class="text-xl font-semibold">Patient log in</h1>
      <p class="text-4xs">Log in to book your appointments.</p>
    </div>
    <div class="flex flex-col space-y-4">
      <div class="flex flex-col space-y-1">
        <span class="text-sm font-normal">Email</span>
        <input type="text" name="email" [(ngModel)]="credentials.email" required email placeholder="" class="border h-10 bg-white border-gray-300 rounded-sm" />
      </div>
      <div class="flex flex-col space-y-1">
        <span class="text-sm font-normal">Password</span>
        <input type="password" name="password" [(ngModel)]="credentials.password" required placeholder="" class="border h-10 bg-white border-gray-300 rounded-sm " />
      </div>
      <div class="flex items-center space-x-3 pt-1">
        <input type="checkbox" id="remember-me" name="remember-me" [checked]="rememberMe"
               class="appearance-none size-5 bg-white border-2 border-slate-300 checked:bg-white checked:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200 cursor-pointer relative checked:after:content-[''] checked:after:absolute checked:after:left-[5px] checked:after:top-[2px] checked:after:w-[5px] checked:after:h-[10px] checked:after:border-r-2 checked:after:border-b-2 checked:after:border-indigo-700 checked:after:rotate-45" />
        <label for="remember-me" class="text-xs font-medium text-slate-600 cursor-pointer select-none">
          Keep me logged in on this trusted device
        </label>
      </div>
      @if(errorMessage()) {
        <div class="p-3 bg-rose-50 border border-rose-100 text-rose-700 text-xs font-medium rounded-xl animate-fade-in">
          {{ errorMessage() }}
        </div>
      }
      <button type="submit"
              (click)="onSubmit()"
              class="bg-indigo-600 text-white font-bold rounded-md h-10 hover:bg-indigo-700 transition"
      >{{isLoading() ? 'Authenticating...' : 'Log in'}}</button>
    </div>
    <a routerLink="/resetpassword" class="text-sm underline text-blue-800">Forgot your password?</a>
  </div>
  <div class="w-full max-w-md flex flex-col items-start mt-6 space-y-4">
    <hr class="w-full border-slate-400" />
    <span class="text-sm font-semibold text-slate-500">Don't have an account?</span>
    <button
      type="button"
      routerLink="/signup"
      class="w-full bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-indigo-600 hover:text-indigo-700 hover:bg-emerald-50/10 transition shadow-sm">
      Create patient account
    </button>
  </div>
</div>
