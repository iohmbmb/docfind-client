<div class="max-w-4xl mx-auto flex">
  <div class="pt-16 pr-12 flex flex-col items-center relative">
    <div class="border rounded-full w-24 h-24 border-gray-300 bg-white z-10 absolute top-13">
    </div>
    <div class="border border-gray-300 pt-12 mt-12 text-center w-48">
      <p class="text-md font-semibold"> Doctor's name </p>
      <p class="m-4 text-sm font-normal"> at Doctor's place</p>
    </div>
  </div>
  <div class="pl-16 flex-1 pt-8 flex flex-col gap-4 justify-center items-center text-center">
    <h1 class="font-bold text-2xl text-slate-700">Have you seen this practitioner before?</h1>
    <div class="text-center pt-6">
      <button
        type="submit",
        (click)="onSubmit(true)" ,
        class="w-sm bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-slate-500 hover:text-slate-900 hover:bg-emerald-50/10 transition shadow-sm"
      >New patient</button>
    </div>
    <div class="text-center">
      <button
        type="submit",
        (click)="onSubmit(false)" ,
        class="w-sm bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-slate-500 hover:text-slate-900 hover:bg-emerald-50/10 transition shadow-sm"
      >Existing patient</button>
    </div>
  </div>
</div>
