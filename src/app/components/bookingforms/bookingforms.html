<div class="w-full flex flex-col items-center px-4 py-8 max-w-xl mx-auto min-h-[calc(100vh-128px)] justify-center">
  <div class="w-full flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider pb-6">
    <div class="flex gap-1">
      <div class="h-1.5 w-8 rounded-full transition" [class.bg-indigo-600]="currentStep() >= 1" [class.bg-slate-200]="currentStep() < 1"></div>
      <div class="h-1.5 w-8 rounded-full transition" [class.bg-indigo-600]="currentStep() >= 2" [class.bg-slate-200]="currentStep() < 2"></div>
      <div class="h-1.5 w-8 rounded-full transition" [class.bg-indigo-600]="currentStep() >= 3" [class.bg-slate-200]="currentStep() < 3"></div>
      <div class="h-1.5 w-8 rounded-full transition" [class.bg-indigo-600]="currentStep() >= 4" [class.bg-slate-200]="currentStep() < 4"></div>
    </div>
  </div>
  <div class="w-fit bg-white border border-slate-200 rounded-xl p-6 shadow-sm min-h-80 flex flex-col">
    @switch (currentStep()) {
      @case (1) {
        <app-forwhoform></app-forwhoform>
      }
      @case (2) {
        <app-forwhereform></app-forwhereform>
      }
      @case (3) {
        <app-forwhatform></app-forwhatform>
      }
      @case (4) {
        <app-forwhenform></app-forwhenform>
      }
    }
    <div class="flex justify-between items-center pt-8 border-t border-slate-100 mt-8">
      <button
        type="button"
        (click)="previousStep()"
        [class.invisible]="currentStep() === 1"
        class="text-sm font-semibold text-slate-600 hover:text-slate-900 transition px-4 py-2">
        Back
      </button>
    </div>
  </div>
</div>
