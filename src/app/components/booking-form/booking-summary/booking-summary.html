<div class="flex max-w-4xl mx-auto">
  <div class="p-8 flex flex-col gap-4 text-center">
    <h1 class="font-bold text-2xl text-slate-700">Confirm this appointment</h1>
    <p class="text-sm text-slate-500">
      You choose a booking for {{day()}} at {{bookingStateService.selectedAppointment()?.getHours()}}:{{bookingStateService.selectedAppointment()?.getMinutes()}}. What would you like to do?
    </p>
    <div class="text-center">
      <button
        type="submit"
        (click)="onSubmit()"
        class="w-sm bg-white text-slate-700 border border-slate-300 font-bold rounded-sm h-11 px-4 hover:border-slate-500 hover:text-slate-900 hover:bg-emerald-50/10 transition shadow-sm cursor-pointer"
      >Confirm</button>
    </div>
    <div class="text-center text-red-500">
      <button
        type="submit"
        (click)="onCancel()"
      > Cancel</button>
    </div>
  </div>
</div>
