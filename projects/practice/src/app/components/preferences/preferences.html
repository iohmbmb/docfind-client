<div class="w-full px-4 py-8 max-w-6xl mx-auto min-h-[calc(100vh-128px)] rounded-3xl border-t border-t-slate-200 shadow-md">
  <div class="grid grid-flow-row grid-cols-2 p-4 m-4">
    <div class="grid place-items-start gap-4">
      <h1 class="text-xl font-bold">Preferences</h1>
      <div class="grid place-items-start gap-1">
        <button
          [class.bg-blue-300]="selectedButton == 'general'"
          [class.text-white]="selectedButton == 'general'"
          [class.bg-transparent]="selectedButton !== 'general'"
          class="rounded-sm [:not(.bg-blue-300)]:hover:bg-gray-300 w-52 h-7 text-start pl-6 transition-colors"
          (click)="selectedButton = 'general'">
          General</button>
        <button
          [class.bg-blue-300]="selectedButton == 'availability'"
          [class.text-white]="selectedButton == 'availability'"
          [class.bg-transparent]="selectedButton !== 'availability'"
          class="rounded-sm [:not(.bg-blue-300)]:hover:bg-gray-300 w-52 h-7 text-start pl-6 transition-colors"
          (click)="selectedButton = 'availability'">
          Availability</button>
      </div>
    </div>
    <div>hej</div>
  </div>
</div>
