<div class="w-full px-2 sm:px-4 py-8 max-w-6xl mx-auto min-h-[calc(100vh-128px)] rounded-3xl border border-slate-200 shadow-md bg-white">
  <!-- Stack vertically on mobile, multi-column row layout on desktop -->
  <div class="flex flex-col md:grid md:grid-cols-[240px_1fr] p-2 sm:p-4 gap-6 md:gap-8">

    <!-- Sidebar Navigation -->
    <div class="flex flex-col items-start gap-4 h-fit border-b md:border-b-0 md:border-r md:border-slate-100 pb-4 md:pb-0 md:pr-4">
      <h1 class="text-xl font-bold text-slate-800">Preferences</h1>
      <div class="w-full flex flex-row md:flex-col gap-1 overflow-x-auto pb-2 md:pb-0">
        <button
          [class.bg-blue-300]="selectedButton == 'general'"
          [class.text-white]="selectedButton == 'general'"
          [class.bg-transparent]="selectedButton !== 'general'"
          class="rounded-sm [:not(.bg-blue-300)]:hover:bg-gray-100 w-full min-w-[160px] md:w-52 h-9 text-start pl-4 md:pl-6 transition-colors cursor-pointer text-sm font-medium"
          (click)="selectedButton = 'general'">
          General
        </button>
      </div>
    </div>

    <!-- Active Component Content View -->
    <div class="w-full min-w-0">
      <app-preferences-general></app-preferences-general>
    </div>

  </div>
</div>
