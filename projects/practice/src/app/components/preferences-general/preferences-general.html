<form (submit)="onSave()" class="grid grid-cols-1 gap-6 w-full max-w-4xl">


  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="firstname">First Name</label>
      <input type="text" id="firstname" [formField]="doctorProfileForm.firstName" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="lastname">Last Name</label>
      <input type="text" id="lastname" [formField]="doctorProfileForm.lastName" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
  </div>

  <!-- Section 2: Contact Communication -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
    <div class="flex flex-col gap-1 md:col-span-2">
      <label class="text-sm font-semibold text-slate-700" for="email">Email</label>
      <input type="email" id="email" [formField]="doctorProfileForm.email" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
  </div>

  <!-- Section 3: Credentials Secure Authorization -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
    <div class="flex flex-col gap-1.5 md:col-span-2">
      <label class="text-sm font-semibold text-slate-700">Password</label>
      <button
        type="button"
        (click)="onChangePassword()"
        class="border rounded-sm p-2 flex flex-row items-center justify-center sm:justify-start gap-2 border-slate-300 hover:border-slate-500 bg-white hover:bg-slate-50 transition cursor-pointer text-sm font-medium w-full sm:w-auto">
        <i data-feather="edit" stroke-width="1.5" class="w-4 h-4"></i>
        Change Password
      </button>
    </div>
  </div>

  <div class="border-b w-full border-slate-200 my-2"></div>

  <!-- Section 4: Physical Practice Geolocation Address Data -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
    <div class="flex flex-col gap-1 sm:col-span-2 md:col-span-4">
      <label class="text-sm font-semibold text-slate-700" for="address">Address</label>
      <input type="text" id="address" [formField]="doctorProfileForm.practiceAddress" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="suburb">Suburb</label>
      <input type="text" id="suburb" [formField]="doctorProfileForm.practiceSuburb" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="state">State</label>
      <input type="text" id="state" [formField]="doctorProfileForm.practiceState" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="postcode">Postcode</label>
      <input type="text" id="postcode" [formField]="doctorProfileForm.practicePostcode" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
    <div class="flex flex-col gap-1 sm:col-span-2 md:col-span-2">
      <label class="text-sm font-semibold text-slate-700" for="phone">Phone</label>
      <input type="tel" id="phone" [formField]="doctorProfileForm.practicePhone" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
  </div>

  <div class="border-b w-full border-slate-200 my-2"></div>

  <!-- Section 5: Consultation Mode -->
  <div class="flex flex-col gap-2">
    <label class="text-sm font-semibold text-slate-800" for="consultation-mode">Consultation Mode</label>
    <div class="w-full max-w-md">
      <select id="consultation-mode"
              [ngModel]="doctorProfileModel().preference"
              [ngModelOptions]="{standalone: true}"
              (ngModelChange)="updateLocation($event)"
              class="w-full h-10 text-sm border border-slate-300 rounded-sm bg-white px-3 focus:outline-indigo-500 transition cursor-pointer">
        @for (location of locations; track location) {
          <option [ngValue]="location">
            {{ formatSpecialty(location) }}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="border-b w-full border-slate-200 my-2"></div>

  <!-- Section 6: Working Hours Repeater Row Blocks -->
  <div class="flex flex-col gap-2">
    <h1 class="text-sm font-semibold text-slate-800">Working Hours</h1>
    <div class="flex flex-col gap-3 w-full">
      @for (hour of doctorProfileModel().workDays; track $index) {
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-slate-50 p-2 sm:p-0 sm:bg-transparent rounded-md border border-slate-100 sm:border-0 shadow-sm sm:shadow-none">

          <select
            [ngModel]="hour.day"
            [ngModelOptions]="{standalone: true}"
            (ngModelChange)="updateWorkDay($index,{day: $event})"
            class="h-10 text-sm border border-slate-300 rounded-sm bg-white px-2 focus:outline-indigo-500 flex-1 sm:flex-none sm:w-40 cursor-pointer">
            @for (day of days; track day) {
              <option [ngValue]="day">
                {{ day }}
              </option>
            }
          </select>

          <div class="flex items-center gap-2 flex-1">
            <input type="time"
                   [ngModel]="hour.startTime"
                   [ngModelOptions]="{standalone: true}"
                   (ngModelChange)="updateWorkDay($index,{startTime: $event})"
                   class="h-10 text-sm border border-slate-300 rounded-sm bg-white px-2 focus:outline-indigo-500 w-full">

            <span class="text-slate-400 text-xs font-medium">to</span>

            <input type="time"
                   [ngModel]="hour.endTime"
                   [ngModelOptions]="{standalone: true}"
                   (ngModelChange)="updateWorkDay($index,{endTime: $event})"
                   class="h-10 text-sm border border-slate-300 rounded-sm bg-white px-2 focus:outline-indigo-500 w-full">
          </div>

          <button
            type="button"
            (click)="removeWorkingHour($index)"
            class="cursor-pointer border rounded-sm h-10 px-3 border-slate-300 hover:border-red-400 text-slate-500 hover:text-red-500 bg-white transition flex items-center justify-center">
            <i data-feather="minus" stroke-width="1.5" class="w-4 h-4"></i>
            <span class="sm:hidden ml-2 text-xs font-semibold">Remove Day</span>
          </button>
        </div>
      }

      <div class="flex justify-start mt-1">
        <button
          type="button"
          (click)="addWorkingHour()"
          class="cursor-pointer border rounded-sm p-2 px-4 border-slate-300 hover:border-indigo-500 text-indigo-600 hover:bg-indigo-50/50 bg-white transition flex items-center gap-2 text-sm font-medium">
          <i data-feather="plus" stroke-width="1.5" class="w-4 h-4"></i>
          Add Working Hours
        </button>
      </div>
    </div>
  </div>

  <div class="border-b w-full border-slate-200 my-2"></div>

  <!-- Section 7: Availability Status Block -->
  <div class="flex flex-col gap-3 max-w-md">
    <label class="text-sm font-semibold text-slate-800" for="availability">Availability Status</label>
    <select id="availability" [formField]="doctorProfileForm.status"
            class="w-full h-10 text-sm border border-slate-300 rounded-sm bg-white px-3 focus:outline-indigo-500 transition cursor-pointer">
      @for (status of statuses; track status) {
        <option [ngValue]="status">
          {{ formatSpecialty(status) }}
        </option>
      }
    </select>

    @if(isAway()){
      <div class="w-full pt-1">
        <mat-form-field class="w-full">
          <mat-label>Enter a date range</mat-label>
          <mat-date-range-input [rangePicker]="picker">
            <input [formField]="doctorProfileForm.absenceStartDate" matStartDate placeholder="Start date">
            <input [formField]="doctorProfileForm.absenceEndDate" matEndDate placeholder="End date">
          </mat-date-range-input>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>
      </div>
    }
  </div>

  <div class="border-b w-full border-slate-200 my-2"></div>

  <!-- Section 8: Rates & Specializations -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-end max-w-2xl">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="rate">Hourly Rate (€)</label>
      <input type="number" id="rate" [formField]="doctorProfileForm.hourlyRate" class="text-slate-700 border border-slate-300 rounded-sm p-1.5 focus:outline-indigo-500 w-full">
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm font-semibold text-slate-700" for="specialty">Specialty</label>
      <select
        id="specialty"
        [ngModel]="doctorProfileModel().specialty"
        [ngModelOptions]="{standalone: true}"
        (ngModelChange)="updateSpecialty($event)"
        class="w-full h-10 text-sm font-normal border border-slate-300 rounded-sm bg-white text-black px-3 focus:outline-indigo-500 transition cursor-pointer">
        @for (specialty of specialties; track specialty) {
          <option [ngValue]="specialty">
            {{ formatSpecialty(specialty) }}
        }></select>
    </div>
  </div>
</form>
