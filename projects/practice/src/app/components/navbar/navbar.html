@if(!isSignupPage && !authService.isAuthenticated()){
  <div class="w-full max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between p-4 gap-y-4 sm:gap-y-0">
    @if (!isLoginPage){
      <a routerLink="/home" class="text-2xl font-bold text-gray-800">DocFind</a>
      <nav class="flex">
        <ul class="flex items-center flex-wrap justify-center gap-y-2 sm:gap-y-0">
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Support</a>
          </li>
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a [href]='patientPortalUrl' class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">I'm a patient</a>
          </li>
          <li class="mx-3 sm:mx-0 sm:ml-6">
            <a routerLink="/login" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Log in</a>
          </li>
        </ul>
      </nav>
    }
  </div>
  @if (!isLoginPage){
    <div class="w-full max-w-5xl mx-auto flex justify-end px-4 sm:px-24 py-4">
      <button (click)="onSubmitToRegister()" class="text-xs bg-indigo-600 text-white font-bold rounded-md h-10 hover:bg-indigo-700 transition px-4 py-2">List your practice</button>
    </div>
  } @else {
    <nav class="flex flex-col sm:flex-row justify-between items-center gap-y-4 sm:gap-y-0">
      <a routerLink="/dashboard" class="text-2xl font-bold text-gray-800 ml-4">Dashboard</a>
      <div class="flex flex-col sm:flex-row justify-center sm:justify-end items-center text-center gap-2 sm:gap-4">
        <p class="text-md font-light text-slate-600 hover:text-slate-900 transition">Don't have an account yet?</p>
        <a routerLink="/home" class="text-md font-semibold text-slate-600 hover:text-slate-900 transition pr-4 sm:pr-0">Join DocFind</a>
        <a [href]='patientPortalUrl'>
          <button class="text-xs bg-indigo-600 text-white font-bold rounded-md h-10 hover:bg-indigo-700 transition px-2 mr-4 sm:mr-0">I'm a patient</button>
        </a>
      </div>
    </nav>
  }
} @else if (authService.isAuthenticated()){
  <div class="flex flex-col sm:flex-row justify-between items-center gap-y-4 sm:gap-y-0 p-4 sm:p-8">
    <a routerLink="/dashboard" class="text-2xl font-bold text-gray-800 ml-4 sm:ml-0">Dashboard</a>
    <nav class="flex">
      <ul class="flex items-center">
        <li class="ml-6">
          <button (click)="onSubmit()" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">Logout</button>
        </li>
      </ul>
    </nav>
  </div>
} @else {
  <div class="bg-indigo-950">
    <div class="w-full max-w-5xl mx-auto flex items-center justify-center p-4">
      <a routerLink="/home" class="text-4xl font-bold text-white">DocFind</a>
    </div>
  </div>
}
