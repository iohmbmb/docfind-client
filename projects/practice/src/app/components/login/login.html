<div class="flex justify-center items-center h-screen">
  <div class="flex flex-col gap-4">
    <div class="text-4xl font-light text-center text-gray-600">Welcome</div>
    <div class="flex flex-col justify-start">
      <div class="text-sm font-semibold py-2">Email</div>
      <input class="w-sm h-13 font-normal border rounded-sm" type="text" required email placeholder="" [(ngModel)]="credentials.email">
      <div class="text-sm font-semibold pt-4 py-2">Password</div>
      <input class="h-13 font-normal border rounded-sm" type="password" required placeholder="" [(ngModel)]="credentials.password">
      @if(errorMessage()) {
        <div class="p-3 bg-rose-50 border border-rose-100 text-rose-700 text-xs font-medium rounded-xl animate-fade-in">
          {{ errorMessage() }}
        </div>
      }
      <div class="flex flex-row mt-4 justify-between">
        <div class="flex flex-col">
          <a routerLink="/resetpassword" class="text-sm font-normal text-gray-500">Forgot your password?</a>
        </div>
        <div class="flex flex-col">
          <button
            (click)="onSubmit()"
            class="bg-indigo-600 text-white font-bold rounded-md h-10 hover:bg-indigo-700 transition w-25"
          >{{isLoading() ? 'Authenticating...' : 'Log in'}}</button>
        </div>
      </div>
    </div>
  </div>
</div>
