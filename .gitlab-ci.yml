stages:
  - lint
  - test
  - build
variables:
  NODE_ENV: ci
  NODE_IMAGE: 'node:20-bullseye'
  COVERAGE_MINIMUM: '85'
lint-format:
  stage: lint
  image: $NODE_IMAGE
  script:
    - npm ci
    - 'npx prettier --check "**/*.{ts,html,css,scss,md,json,scss.d.ts}"'
    - npx eslint src/**/*.ts --max-warnings=0
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE ==
        "merge_request_event"
      when: always
