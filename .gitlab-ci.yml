build-prod:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci
    - npx ng build --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success

